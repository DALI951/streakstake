<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141124"/>
      <stop offset="50%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#06070c"/>
    </linearGradient>

    <!-- Hex Shield Border Glow -->
    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00"/>
      <stop offset="50%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#8b00ff"/>
    </linearGradient>

    <!-- Flame Energy Gradient -->
    <linearGradient id="flame-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="30%" stop-color="#ff8c00"/>
      <stop offset="70%" stop-color="#ff2200"/>
      <stop offset="100%" stop-color="#b700ff"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ff3300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for neon bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>

  <!-- Subtle Outer Border -->
  <rect width="506" height="506" x="3" y="3" rx="117" fill="none" stroke="url(#shield-stroke)" stroke-width="6" opacity="0.4"/>

  <!-- Ambient Glow Behind Hex Shield -->
  <circle cx="256" cy="256" r="160" fill="url(#core-glow)" filter="url(#bloom)"/>

  <!-- Futuristic Hexagonal Staking Shield -->
  <polygon points="256,70 410,158 410,336 256,424 102,336 102,158" 
           fill="#161828" 
           fill-opacity="0.85"
           stroke="url(#shield-stroke)" 
           stroke-width="12" 
           stroke-linejoin="round"/>

  <!-- Inner Hex Ring -->
  <polygon points="256,104 380,175 380,317 256,388 132,317 132,175" 
           fill="none" 
           stroke="#ff7700" 
           stroke-width="3" 
           stroke-dasharray="14 10" 
           opacity="0.6"/>

  <!-- The Energetic 'S' Flame (Streak + Stake) -->
  <path d="M256,110 
           C295,145 320,190 295,230 
           C280,255 240,265 225,285 
           C205,310 220,350 256,365 
           C295,380 340,355 350,330 
           C325,340 290,330 280,310 
           C270,290 295,275 315,255 
           C345,225 350,165 256,110 Z" 
        fill="url(#flame-grad)" 
        filter="url(#bloom)"/>

  <!-- Inner Hot White Core Flame -->
  <path d="M256,145 
           C275,175 285,205 272,228 
           C260,248 235,256 226,274 
           C212,298 228,328 256,338 
           C240,332 232,318 235,302 
           C240,285 260,274 272,260 
           C290,238 292,192 256,145 Z" 
        fill="#ffffff" 
        opacity="0.95"/>

  <!-- Spark Embers -->
  <circle cx="195" cy="190" r="7" fill="#ffdd55" filter="url(#bloom)"/>
  <circle cx="330" cy="160" r="5" fill="#ffaa33" filter="url(#bloom)"/>
  <circle cx="340" cy="285" r="6" fill="#ff5522" filter="url(#bloom)"/>
  <circle cx="170" cy="300" r="4" fill="#ffaa00" filter="url(#bloom)"/>
</svg>
