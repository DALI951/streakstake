name: Build & Release Native Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Native Android APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK binary for release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/StreakStake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakStake-Native-APK
          path: release-artifacts/StreakStake.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.4.0' }}
          name: StreakStake Native Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.4.0' }}
          draft: false
          prerelease: false
          files: release-artifacts/StreakStake.apk
          body: |
            ## StreakStake v2.4.0 - Complete Core Rebuild

            ### Direct Download
            - **APK Binary:** [`StreakStake.apk`](https://github.com/DALI951/streakstake/releases/download/v2.4.0/StreakStake.apk)

            ### Core Features in v2.4.0:
            - **Native Google Sign-In:** Prompts for real Google accounts with native account selector (`play-services-auth`). Automatically derives user name and `@tag`.
            - **Facebook Login & Account Linking:** Link Facebook in Settings to save your account and discover Facebook friends using StreakStake. Full account restore on login across Google, Facebook, or unique 8-character ID.
            - **Unique 8-Character ID:** Cryptographically generated upon account creation containing uppercase, lowercase, numbers, and symbols (e.g. `K9#mX2!a`) with 1-tap copy.
            - **Home Page (Two Halves):**
              - Top: Your personal challenge & goal setting (distance targets 500m–5km, XP stakes 50–500 XP, live step progress).
              - Bottom: Friend challenges with **live countdown timers** (`02h 45m 12s remaining`). Clean empty state when no friends have active stakes.
            - **Friends Page (Accountability Circle):**
              - Multi-channel adding: Strict database-validated search (nonexistent users cannot be added; cannot add self), 8-character ID input, and ZXing QR code generator & scanner.
              - Incoming invitations tab with instant Accept / Decline actions.
              - Facebook friend suggestions with Add and Delete/Dismiss options.
            - **Clean In-App Updates:** One-tap clean update button without changelog bloat.
            - **100% App-Made Vector Drawables:** Zero generic emojis, zero stock icons—bespoke vector glyphs for StreakStake.
            - **Minimal Dark Cinema Design:** Strict 2-color palette (#0A0A0F base, #12121A surface, and #DC2626 crimson accent).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
