name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK binary for release
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/StreakStake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakStake-Android-APK
          path: release-artifacts/StreakStake.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: StreakStake Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          draft: false
          prerelease: false
          files: release-artifacts/StreakStake.apk
          body: |
            ## 🔥 StreakStake v1.1.0 Android Release
            
            Download the official **StreakStake APK** directly onto your Android device.

            ### 📱 Direct Download
            - **Binary:** [`StreakStake.apk`](https://github.com/DALI951/streakstake/releases/download/v1.1.0/StreakStake.apk)

            ### 🌟 New Features in v1.1.0:
            - 🚶 **Live Walk Distance & Step Detection:** Set walking target (e.g. 500 meters) and track real-time physical steps via accelerometer motion peaks and GPS distance telemetry.
            - 🔐 **Real Firebase Auth & Zero Bloat:** Requires clean sign in at launch with Google or Email. No dummy clutter. Starter 500 XP granted on registration.
            - 🎨 **Unique 3D App Icon:** Custom-designed energetic neon flame 'S' crest and launcher icons.
            - 🔄 **In-App GitHub OTA Updater:** Check releases and install updates directly from within the app.
            - 🛡️ **Peer Proof-or-Burn:** Mandatory friend verification with Arbiter bonuses.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
