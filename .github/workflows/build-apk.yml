name: Build & Release Native Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Native Android APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK binary for release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/StreakStake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakStake-Native-APK
          path: release-artifacts/StreakStake.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          name: StreakStake Native Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0' }}
          draft: false
          prerelease: false
          files: release-artifacts/StreakStake.apk
          body: |
            ## 📱 StreakStake v2.0.0 - 100% Native Android

            Completely rebuilt from the ground up as a pure native Android application (Kotlin & Gradle). Zero TypeScript, zero web views, zero bloat.

            ### 🚀 Direct Download
            - **APK Binary:** [`StreakStake.apk`](https://github.com/DALI951/streakstake/releases/download/v2.0.0/StreakStake.apk)

            ### 🌟 Key Native Features:
            - 🎯 **100% Native Android:** Built in Kotlin with native XML view layouts. Adapts perfectly to any Android screen resolution, notch, and DPI.
            - 🎨 **Minimalist Two-Color Design:** Pitch Black (`#0A0B10`) and Flame Orange (`#FF5500`). Zero clutter.
            - 🔐 **Authentication First:** Starts cleanly on the Sign In / Sign Up screen. Zero fake seed challenges or dummy clutter. Grants 500 XP starter balance.
            - 🚶 **Hardware Step & Walking Meter Detector:** Uses Android's `SensorManager` (hardware step detector + accelerometer peak filter) and GPS location to track exact meters walked in real time.
            - 🔥 **Streak Multipliers & XP Staking:** Put 50, 100, or 200 XP on the line before starting. Hit goals to win your stake plus 1.5x payout!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
