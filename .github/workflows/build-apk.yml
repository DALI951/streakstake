name: Build & Release Native Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Native Android APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK binary for release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/StreakStake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakStake-Native-APK
          path: release-artifacts/StreakStake.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.5.2' }}
          name: StreakStake Native Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.5.2' }}
          draft: false
          prerelease: false
          files: release-artifacts/StreakStake.apk
          body: |
            ## StreakStake v2.5.2 - Live Multi-Device Cloud Sync & Cross-Device Invites

            ### Direct Download
            - **APK Binary:** [`StreakStake.apk`](https://github.com/DALI951/streakstake/releases/download/v2.5.2/StreakStake.apk)

            ### Highlights in v2.5.2:
            - **Live Cross-Device Firebase Cloud Database:**
              - Fixes athlete detection across phones: any registered account on Phone A is immediately discoverable on Phone B by 8-character ID, name, or @tag.
              - Live invitations: sending an invite immediately syncs to the recipient's phone via Firebase Realtime Database.
              - Real-time Invites tab: incoming invitations appear with [Accept] and [Decline] options and instant push to mutual friends.
            - **Permanent Cryptographic Signature Keystore:**
              - Signed with the permanent keystore for seamless 1-tap in-app updates with zero signature conflicts.
            - **Custom Challenge Engine & Live Timers:**
              - Friend challenges with real-time countdown timers.
              - Custom rep/distance/time goals with dynamic rep counters (+1, +5, +10, -1).
            - **Bespoke Vector UI:**
              - Zero emojis, Dark Cinema aesthetic (#0A0A0F / #12121A / #DC2626 crimson).
            - **Rock-Solid In-App Updater:**
              - Follows GitHub multi-hop CDN redirects securely.
              - Pre-validates APK integrity with Android PackageManager before triggering install.
              - Seamless FileProvider integration with universal cache storage.
            - **Seamless 1-Tap Google & Facebook Authentication (Zero Typing):**
              - Automatically retrieves your account without manual typing.
              - Dedicated 1-tap OAuth bottom sheet for Facebook linking and login.
            - **Fully Customizable Challenge Engine:**
              - Create, name, and configure any challenge (Pushups, Pull-ups, Squats, Running, etc.) with custom targets, units, and XP stakes.
              - Interactive rep logger with dynamic `+1`, `+5`, `+10`, `-1` buttons and native motion detection.
            - **Live Friend Countdown Timers:**
              - Real-time countdown timers ticking down on friend challenge cards.
            - **Zero Emojis & Dark Cinema UI:**
              - Clean aesthetic (#0A0A0F / #12121A / #DC2626 crimson).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
