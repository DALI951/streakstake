name: Build & Release Native Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Native Android APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK binary for release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/StreakStake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakStake-Native-APK
          path: release-artifacts/StreakStake.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.0' }}
          name: StreakStake Native Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.0' }}
          draft: false
          prerelease: false
          files: release-artifacts/StreakStake.apk
          body: |
            ## 📱 StreakStake v2.1.0 - Native Social Accountability & In-App Updater

            Completely rebuilt as a 100% Native Android application (Kotlin & Gradle). Zero TypeScript, zero web views, zero bloat.

            ### 🚀 Direct Download
            - **APK Binary:** [`StreakStake.apk`](https://github.com/DALI951/streakstake/releases/download/v2.1.0/StreakStake.apk)

            ### 🌟 Key Features:
            - ⚡ **In-App GitHub Auto-Updater:** Checks GitHub Releases directly inside the app, downloads the APK, and prompts native Android package installation with one tap.
            - ⚖️ **Peer Verification System ("Proof or Burn"):** Staked XP remains locked in escrow until friends review proof (steps/distance/notes) and tap "Verify" (+1.5x reward) or "Burn" (XP forfeited, streak reset).
            - 🔥 **Live Social Dashboard:** Real-time activity feed showing friend stakes, verifications, and streak milestones without page refresh.
            - 🏆 **Friends & Leaderboard:** Search & add friends via @username or email; live weekly rankings by XP balance and active streaks.
            - 🚶 **Hardware Step & GPS Meter Detection:** Real-time sensor counting (`SensorManager` step detector + accelerometer peak filtering + GPS meter calculations).
            - 🎨 **Minimalist Two-Color Design:** Pitch Black (`#0A0B10`) & Flame Orange (`#FF5500`) with zero bloat.
            - 🔐 **Authentication First:** Clean Sign-In screen with starter 500 XP grant.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
