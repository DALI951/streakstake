name: Build & Release Native Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Native Android APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK binary for release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/StreakStake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakStake-Native-APK
          path: release-artifacts/StreakStake.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.3.0' }}
          name: StreakStake Native Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.3.0' }}
          draft: false
          prerelease: false
          files: release-artifacts/StreakStake.apk
          body: |
            ## 📱 StreakStake v2.3.0 - Calisthenics Design System Overhaul

            Completely rebuilt using Dali's Calisthenics "Dark Cinema First" design system (#0A0A0F base, #12121A surface, hairline borders, and the ONE crimson red accent #DC2626).

            ### 🚀 Direct Download
            - **APK Binary:** [`StreakStake.apk`](https://github.com/DALI951/streakstake/releases/download/v2.3.0/StreakStake.apk)

            ### 🌟 Design & Feature Upgrades:
            - 🎨 **Dali's Calisthenics Design System:** True dark cinema styling with `#0A0A0F` base, `#12121A` surface, hairline borders (`rgba(255, 255, 255, 0.08)`), and the signature `#DC2626` / `#EF4444` crimson red accent.
            - ⚡ **Instant 1-Tap Google Entry:** Direct entry with zero questions, no email prompt, no personal name used. Grants an anonymous athlete handle and 500 XP starter balance immediately.
            - 📊 **3-Column Stat Row:** 28sp tabular bold figures for XP balance, active day streak, and verified challenges.
            - ⚙️ **Calisthenics Profile & Settings Hub:**
              - Identity card with athlete initial circle avatar, name, handle, and Level XP progress bar.
              - In-App GitHub Auto-Updater (checks releases, downloads, and launches package installer).
              - Motion controls: toggle GPS distance tracking and haptic vibration feedback.
              - Data controls: reset activity data / sign out.
            - ⚖️ **Peer Verification Hub:** Review pending proofs with 1-tap "Verify" (+1.5x payout) or "Burn".
            - 🚶 **Native Step & Meter Detector:** Hardware sensor counting + GPS distance tracking.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
