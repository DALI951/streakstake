name: Build & Release Native Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Native Android APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK binary for release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/StreakStake.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakStake-Native-APK
          path: release-artifacts/StreakStake.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0' }}
          name: StreakStake Native Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.2.0' }}
          draft: false
          prerelease: false
          files: release-artifacts/StreakStake.apk
          body: |
            ## 📱 StreakStake v2.2.0 - Elevated UI/UX, Dedicated Settings & Instant Google Sign-In

            Completely rebuilt as a 100% Native Android application (Kotlin & Gradle). Zero TypeScript, zero web views, zero bloat.

            ### 🚀 Direct Download
            - **APK Binary:** [`StreakStake.apk`](https://github.com/DALI951/streakstake/releases/download/v2.2.0/StreakStake.apk)

            ### 🌟 What's New in v2.2.0:
            - ⚡ **Instant One-Tap Google Sign-In:** Direct entry without asking for email, forms, or actual personal name. Automatically assigns an anonymous challenger handle and grants 500 XP starter balance immediately.
            - ⚙️ **Dedicated Settings & Config Screen:**
              - Account configuration (customize Display Name and @Username handle).
              - In-App GitHub Auto-Updater (check for updates, download & install latest APK).
              - Motion & Sensor controls (toggle GPS distance tracking and haptic vibration feedback).
              - Data management (reset activity data / sign out).
            - 🎨 **Elevated UI/UX:** Refined dark athletic aesthetic strictly adhering to Pitch Black (`#0A0B10`) and Flame Orange (`#FF5500`), clean navigation, and sleek cards.
            - ⚖️ **Peer Verification ("Proof or Burn"):** Staked XP stays in escrow until friends verify proof (+1.5x reward) or burn stake.
            - 🔥 **Live Social Dashboard:** Real-time activity feed showing friend stakes, verifications, and burns.
            - 🚶 **Hardware Step & Walking Meter Detector:** Uses Android's `SensorManager` and GPS for step detection.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
