name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK binary for release
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/StreakStake-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreakStake-Android-APK
          path: release-artifacts/StreakStake-v1.0.0.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: StreakStake Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: release-artifacts/StreakStake-v1.0.0.apk
          body: |
            ## 🔥 StreakStake Android Release
            
            Download the official **StreakStake APK** directly onto your Android device to start staking XP with friends and enforcing peer accountability.

            ### 📱 Direct Download
            - **Binary:** [`StreakStake-v1.0.0.apk`](https://github.com/DALI951/streakstake/releases/download/v1.0.0/StreakStake-v1.0.0.apk)

            ### 🌟 Core Gamification & Accountability Mechanics
            - 💎 **XP Staking & Multipliers:** Put XP on the line; hitting a 3-challenge streak triggers an automatic 1.5x payout multiplier (2.0x for 5+ streaks).
            - 🛡️ **Peer Verification System ("The Verification Gap"):** Completed challenges remain in *Pending* status until an accountability partner reviews and verifies your proof photo or note.
            - 💀 **Automated Punishment & Burn Engine:** Lapsed deadlines and rejected proofs immediately burn staked XP and reset streaks to 0.
            - ⚡ **Real-Time Social Dashboard:** Live activity feed showing friend commitments, verifications, and burns.
            - 🏆 **Weekly Leaderboard & Reset Timer:** Compete against friends for seasonal ranks and accolades.
            - 🏅 **Tier Badges:** First Blood, Triple Threat, High Roller, Fair Arbiter, Iron Will, and Legendary.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
